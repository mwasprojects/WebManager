services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webmanager
      POSTGRES_USER: webmanager
      POSTGRES_PASSWORD: webmanager_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmanager -d webmanager"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - webmanager_postgres_data:/var/lib/postgresql/data
    networks: [webmanager]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    networks: [webmanager]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://webmanager:webmanager_local_only@db:5432/webmanager
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your .env file}
      DB_POOL_MAX: 10
      DATABASE_SSL: "false"
      EMAIL_FROM: ${EMAIL_FROM:-WebManager <no-reply@webmanager.local>}
      EMAIL_SERVER_HOST: mailpit
      EMAIL_SERVER_PORT: 1025
      EMAIL_SERVER_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: sh -c "pnpm --filter @webmanager/api db:migrate && pnpm --filter @webmanager/api dev"
    networks: [webmanager]
    restart: unless-stopped

  web-user:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_PORTAL_KIND: user
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace
      - webmanager_node_modules:/workspace/node_modules
      - webmanager_web_node_modules:/workspace/apps/web/node_modules
      - webmanager_web_user_next:/workspace/apps/web/.next
    depends_on: [api]
    networks: [webmanager]

  web-developer:
    profiles: ["multi-portal"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_PORTAL_KIND: developer
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - .:/workspace
      - webmanager_node_modules:/workspace/node_modules
      - webmanager_web_node_modules:/workspace/apps/web/node_modules
      - webmanager_web_developer_next:/workspace/apps/web/.next
    depends_on: [api]
    networks: [webmanager]

  web-admin:
    profiles: ["multi-portal"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_PORTAL_KIND: admin
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - .:/workspace
      - webmanager_node_modules:/workspace/node_modules
      - webmanager_web_node_modules:/workspace/apps/web/node_modules
      - webmanager_web_admin_next:/workspace/apps/web/.next
    depends_on: [api]
    networks: [webmanager]

volumes:
  webmanager_postgres_data:
  webmanager_node_modules:
  webmanager_web_node_modules:
  webmanager_web_user_next:
  webmanager_web_developer_next:
  webmanager_web_admin_next:

networks:
  webmanager:
    driver: bridge
